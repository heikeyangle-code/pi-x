name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android app (analyze + test + apk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Accept Android SDK licenses and install NDK 29
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="/opt/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          echo "Using sdkmanager: $SDKM"
          [ -x "$SDKM" ] || ls -R "$ANDROID_HOME/cmdline-tools" 2>/dev/null | head -20
          yes | "$SDKM" --licenses
          yes | "$SDKM" "ndk;29.0.13846066"
          echo "--- installed NDKs ---"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "NO NDK DIR"
      - name: Regenerate router / codegen
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Tests
        run: flutter test
      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: pi-x-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  bridge:
    name: Bridge (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p packages/bridge/tsconfig.json

  engine-smoke:
    name: Engine smoke (real pi bundle + EngineProcess)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile bridge
        run: npm ci && npx tsc -p packages/bridge/tsconfig.json
      - name: Real engine round-trip
        run: node scripts/pi-host-smoke.mjs
      - name: cc-adapter mapping assertions
        run: node scripts/cc-adapter-check.mjs
