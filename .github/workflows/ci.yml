name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android app (analyze + test + apk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Regenerate router / codegen
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug

  bridge:
    name: Bridge (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p packages/bridge/tsconfig.json

  engine-smoke:
    name: Engine smoke (real pi bundle + EngineProcess)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile bridge
        run: npm ci && npx tsc -p packages/bridge/tsconfig.json
      - name: Real engine round-trip
        run: node scripts/pi-host-smoke.mjs
